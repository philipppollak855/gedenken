# docker-compose.yml
# KORRIGIERT: Der Build-Kontext wurde angepasst, um die Render-Umgebung zu spiegeln.
# NEU: UTF-8 Kodierung für die Datenbank erzwungen.
# KORRIGIERT: Der `command` nutzt jetzt das entrypoint.sh, um die lokale Umgebung an die Produktion anzugleichen.

services:
  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile 
    command: sh -c "./entrypoint.sh" # GEÄNDERT: Führt das Skript aus und startet Gunicorn
    volumes:
      - ./backend:/app
      # NEU: Volume für hochgeladene Medien im lokalen Docker-Setup
      - media_data:/app/media 
    ports:
      - "8000:8000" # Geändert auf 8000, um mit Gunicorn übereinzustimmen
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=vorsorge_user
      - POSTGRES_PASSWORD=vorsorge_pass
      - POSTGRES_DB=vorsorge_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
      - POSTGRES_LC_COLLATE=C
      - POSTGRES_LC_CTYPE=C.UTF-8

volumes:
  postgres_data:
  # NEU: Definiert das Docker-Volume für die Mediendateien
  media_data:

