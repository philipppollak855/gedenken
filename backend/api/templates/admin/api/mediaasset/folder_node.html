<!-- backend/api/templates/admin/api/mediaasset/folder_node.html -->
<li>
    {# KORREKTUR: Prüft, ob 'current_folder' existiert, bevor auf .id zugegriffen wird #}
    <a href="?folder_id={{ node.folder.id }}" class="{% if current_folder and current_folder.id == node.folder.id %}active{% endif %}">
        <i class="fas fa-folder"></i> {{ node.folder.name }}
    </a>
    {% if node.children %}
        <ul>
            {% for child_node in node.children %}
                {% include "admin/api/mediaasset/folder_node.html" with node=child_node %}
            {% endfor %}
        </ul>
    {% endif %}
</li>
