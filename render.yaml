# render.yaml
# KORRIGIERT: Der Pfad zum Settings-Modul wurde korrigiert.
# NEU: explizite Pfade für MEDIA_ROOT hinzugefügt

databases:
  - name: vorsorge-db
    plan: free

services:
  # Django Backend Service
  - type: web
    name: vorsorge-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "bash entrypoint.sh" # GEÄNDERT: Startet über das entrypoint-Skript
    
    disks:
      - name: media-storage
        mountPath: /var/media
        sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vorsorge-db
          property: connectionString
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DJANGO_SUPERUSER_EMAIL
        value: philipp.pollak855@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "24061998"
      - key: CORS_ALLOWED_ORIGINS 
        value: "https://gedenken.netlify.app http://localhost:3000"
      - key: ALLOWED_HOSTS 
        value: "vorsorge-backend.onrender.com"
      - key: PGCLIENTENCODING
        value: utf8
      # NEU: Definiert den Pfad für die hochgeladenen Dateien in der Produktionsumgebung
      - key: MEDIA_ROOT
        value: /var/media/media
      # NEU: Definiert die URL des Backends für die korrekte Erstellung der Bild-URLs
      - key: BACKEND_URL
        value: "https://vorsorge-backend.onrender.com"
