<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuer Trauerdruck-Entwurf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #8c8073 0%, #6b5b73 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .form-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .form-content {
            padding: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8c8073;
            background: white;
            box-shadow: 0 0 0 3px rgba(140, 128, 115, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .priority-selector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .priority-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .priority-option:hover {
            border-color: #8c8073;
            background: white;
        }

        .priority-option.selected {
            border-color: #8c8073;
            background: #8c8073;
            color: white;
        }

        .priority-option.urgent {
            border-color: #dc3545;
        }

        .priority-option.urgent.selected {
            background: #dc3545;
        }

        .priority-option.high {
            border-color: #fd7e14;
        }

        .priority-option.high.selected {
            background: #fd7e14;
        }

        .priority-option.normal {
            border-color: #28a745;
        }

        .priority-option.normal.selected {
            background: #28a745;
        }

        .priority-option.low {
            border-color: #6c757d;
        }

        .priority-option.low.selected {
            background: #6c757d;
        }

        .file-upload-area {
            border: 2px dashed #8c8073;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload-area:hover {
            border-color: #6b5b73;
            background: #f0f0f0;
        }

        .file-upload-area.dragover {
            border-color: #8c8073;
            background: #e8f4f8;
        }

        .file-upload-icon {
            font-size: 3rem;
            color: #8c8073;
            margin-bottom: 15px;
        }

        .file-upload-text {
            color: #666;
            font-size: 1.1rem;
        }

        .file-upload-hint {
            color: #999;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .form-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e1e5e9;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8c8073 0%, #6b5b73 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(140, 128, 115, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e1e5e9;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8c8073, #6b5b73);
            width: 0%;
            transition: width 0.3s ease;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .form-content {
                padding: 20px;
            }
            
            .form-header {
                padding: 20px;
            }
            
            .form-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Neuer Trauerdruck-Entwurf</h1>
            <p>Erstellen Sie einen würdevollen Entwurf für Trauerdruck-Materialien</p>
        </div>
        
        <div class="form-content">
            <form id="trauerdruckForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">Titel des Entwurfs *</label>
                        <input type="text" id="title" name="title" required placeholder="z.B. Trauerkarte für Max Mustermann">
                    </div>
                    
                    <div class="form-group">
                        <label for="trauerdruck_type">Trauerdruck-Art *</label>
                        <select id="trauerdruck_type" name="trauerdruck_type" required>
                            <option value="">Bitte wählen...</option>
                            <option value="1">Trauerkarte</option>
                            <option value="2">Danksagung</option>
                            <option value="3">Einladung</option>
                            <option value="4">Gedenkblatt</option>
                            <option value="5">Urkunde</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="memorial_page">Gedenkseite *</label>
                        <select id="memorial_page" name="memorial_page" required>
                            <option value="">Bitte wählen...</option>
                            <!-- Wird dynamisch gefüllt -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priorität</label>
                        <div class="priority-selector">
                            <div class="priority-option normal" data-value="normal">
                                <div>Normal</div>
                                <small>Standard</small>
                            </div>
                            <div class="priority-option high" data-value="high">
                                <div>Hoch</div>
                                <small>Wichtig</small>
                            </div>
                            <div class="priority-option urgent" data-value="urgent">
                                <div>Dringend</div>
                                <small>Eilig</small>
                            </div>
                        </div>
                        <input type="hidden" id="priority" name="priority" value="normal">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="description">Beschreibung</label>
                    <textarea id="description" name="description" placeholder="Beschreiben Sie den Entwurf und besondere Wünsche..."></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Design-Dateien hochladen</label>
                    <div class="file-upload-area" id="fileUploadArea">
                        <div class="file-upload-icon">📁</div>
                        <div class="file-upload-text">Dateien hier ablegen oder klicken zum Auswählen</div>
                        <div class="file-upload-hint">Unterstützte Formate: PDF, JPG, PNG, AI, PSD (max. 10MB)</div>
                        <input type="file" id="design_files" name="design_files" multiple accept=".pdf,.jpg,.jpeg,.png,.ai,.psd" style="display: none;">
                    </div>
                    <div class="progress-bar" id="progressBar" style="display: none;">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Entwurf erstellen</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Priority Selection
        document.querySelectorAll('.priority-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.priority-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                document.getElementById('priority').value = this.dataset.value;
            });
        });

        // File Upload
        const fileUploadArea = document.getElementById('fileUploadArea');
        const fileInput = document.getElementById('design_files');

        fileUploadArea.addEventListener('click', () => fileInput.click());

        fileUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUploadArea.classList.add('dragover');
        });

        fileUploadArea.addEventListener('dragleave', () => {
            fileUploadArea.classList.remove('dragover');
        });

        fileUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileDisplay();
        });

        fileInput.addEventListener('change', updateFileDisplay);

        function updateFileDisplay() {
            const files = fileInput.files;
            if (files.length > 0) {
                fileUploadArea.innerHTML = `
                    <div class="file-upload-icon">✅</div>
                    <div class="file-upload-text">${files.length} Datei(en) ausgewählt</div>
                    <div class="file-upload-hint">Klicken zum Ändern</div>
                `;
            }
        }

        // Form Submission
        document.getElementById('trauerdruckForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const submitBtn = this.querySelector('button[type="submit"]');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird erstellt...';
            progressBar.style.display = 'block';
            
            try {
                const response = await fetch('/api/trauerdruck-entwuerfe/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                
                if (response.ok) {
                    showMessage('Entwurf erfolgreich erstellt!', 'success');
                    setTimeout(() => {
                        closeModal();
                    }, 2000);
                } else {
                    const error = await response.json();
                    showMessage('Fehler beim Erstellen: ' + (error.detail || 'Unbekannter Fehler'), 'error');
                }
            } catch (error) {
                showMessage('Netzwerkfehler: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entwurf erstellen';
                progressBar.style.display = 'none';
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'success' ? 'success-message' : 'error-message';
            messageDiv.textContent = message;
            
            const formContent = document.querySelector('.form-content');
            formContent.insertBefore(messageDiv, formContent.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function closeModal() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeModal' }, '*');
            } else {
                window.close();
            }
        }

        // Load Memorial Pages
        async function loadMemorialPages() {
            try {
                const response = await fetch('/api/memorial-pages/');
                const data = await response.json();
                const select = document.getElementById('memorial_page');
                
                data.results.forEach(page => {
                    const option = document.createElement('option');
                    option.value = page.id;
                    option.textContent = `${page.first_name} ${page.last_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Gedenkseiten:', error);
            }
        }

        // Load Trauerdruck Types
        async function loadTrauerdruckTypes() {
            try {
                const response = await fetch('/api/trauerdruck-types/');
                const data = await response.json();
                const select = document.getElementById('trauerdruck_type');
                
                data.results.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type.id;
                    option.textContent = type.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Trauerdruck-Typen:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadMemorialPages();
            loadTrauerdruckTypes();
        });
    </script>
</body>
</html>
